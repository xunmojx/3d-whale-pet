<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>音乐播放器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;}
body{background:#141a2c;color:#fff;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
#titlebar{display:flex;align-items:center;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.08);-webkit-app-region:drag;}
#titlebar .label{flex:1;font-size:12px;color:rgba(200,210,240,.7);}
#titlebar button{width:22px;height:22px;border:none;border-radius:5px;background:transparent;color:rgba(255,255,255,.6);cursor:pointer;font-size:13px;-webkit-app-region:no-drag;}
#titlebar button:hover{background:rgba(77,107,254,.3);color:#fff;}
#import-btn{margin:10px;padding:8px;border:2px dashed rgba(120,140,255,.3);border-radius:8px;text-align:center;cursor:pointer;font-size:12px;color:rgba(200,210,240,.6);background:transparent;}
#import-btn:hover{background:rgba(77,107,254,.15);}
#sys-btn{margin:0 10px 10px;padding:6px;border:1px solid rgba(120,140,255,.25);border-radius:8px;text-align:center;cursor:pointer;font-size:11px;color:rgba(200,210,240,.65);background:transparent;width:calc(100% - 20px);}
#sys-btn:hover{background:rgba(77,107,254,.15);}
#sys-btn.on{background:rgba(77,107,254,.28);color:#fff;border-color:rgba(120,140,255,.6);}
#playlist{flex:1;overflow-y:auto;margin:0 10px;display:flex;flex-direction:column;gap:3px;}
#playlist-empty{text-align:center;padding:15px 0;font-size:11px;color:rgba(200,210,240,.6);}
.pl-item{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:11px;color:rgba(200,210,240,.6);}
.pl-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.pl-item.active{background:rgba(77,107,254,.2);color:#fff;border-left:3px solid #4d6bfe;}
.pl-item .num{font-size:10px;color:rgba(200,210,240,.4);width:16px;text-align:right;flex-shrink:0;}
.pl-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pl-item .del{border:none;background:transparent;color:rgba(255,100,100,.5);cursor:pointer;font-size:12px;padding:0 2px;}
.pl-item .del:hover{color:#ff6060;}
.progress{display:flex;align-items:center;gap:6px;margin:6px 10px;font-size:10px;color:rgba(200,210,240,.6);}
.progress input{flex:1;}
.ctrl{display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 0;}
.ctrl button{width:34px;height:34px;border:none;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);color:#fff;}
.ctrl button:hover{background:rgba(77,107,254,.3);}
.ctrl button.play{background:#4d6bfe;width:40px;height:40px;font-size:18px;}
.modes{display:flex;gap:6px;justify-content:center;padding:2px 0;}
.modes button{border:1px solid rgba(120,140,255,.25);border-radius:7px;padding:5px 8px;font-size:10px;cursor:pointer;background:rgba(255,255,255,.06);color:rgba(200,210,240,.6);}
.modes button.active{background:#4d6bfe;color:#fff;border-color:#4d6bfe;}
.vol{display:flex;align-items:center;gap:6px;margin:6px 10px 12px;font-size:12px;color:rgba(200,210,240,.6);}
.vol input{flex:1;}
input[type=range]{-webkit-appearance:none;height:3px;border-radius:2px;background:rgba(255,255,255,.12);outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#4d6bfe;cursor:pointer;}
</style>
</head>
<body>
<div id="titlebar">
  <span class="label">🎵 音乐播放器</span>
  <button id="min-btn" title="最小化（音乐继续）">🗕</button>
  <button id="close-btn" title="关闭">✕</button>
</div>
<button id="import-btn">📁 导入音频</button>
<button id="sys-btn" title="抓取电脑正在播放的声音（别的软件放歌也能跟着跳）">🎧 监听电脑声音</button>
<div id="playlist"></div>
<div id="playlist-empty">还没有音频，点击上方导入</div>
<div id="bpm-readout" style="padding:4px 12px;font-size:11px;color:rgba(160,180,230,.75);font-variant-numeric:tabular-nums">BPM --（只读，用于观察）</div>
<div class="progress">
  <span id="time-cur">00:00</span>
  <input type="range" id="seek" min="0" max="1000" value="0">
  <span id="time-total">00:00</span>
</div>
<div class="ctrl">
  <button id="prev" title="上一首">⏮</button>
  <button class="play" id="play">▶</button>
  <button id="stop" title="停止">⏹</button>
  <button id="next" title="下一首">⏭</button>
</div>
<div class="modes">
  <button data-mode="seq" class="active">🔁 顺序</button>
  <button data-mode="shuffle">🔀 随机</button>
  <button data-mode="loop">🔂 循环</button>
  <button data-mode="single">🔂 单曲</button>
</div>
<div class="vol">
  <span>🔊</span>
  <input type="range" id="vol" min="0" max="100" value="70">
</div>
<script>
(function () {
  // 两个桥各管一半，只取一个可能拿不到要用的方法
  var api = Object.assign({}, window.petWindow || {}, window.petBridge || {});
  var audio = document.createElement('audio');
  audio.preload = 'auto';
  document.body.appendChild(audio);

  var queue = [], index = -1, mode = 'seq', seeking = false;
  function el(id) { return document.getElementById(id); }

  function fmt(t) {
    if (!t || !isFinite(t)) return '00:00';
    var m = Math.floor(t / 60), s = Math.floor(t % 60);
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }
  function refresh() {
    var c = audio.currentTime || 0, d = audio.duration || 0;
    el('time-cur').textContent = fmt(c);
    el('time-total').textContent = fmt(d);
    if (!seeking && d > 0) el('seek').value = Math.round(c / d * 1000);
  }
  ['loadedmetadata', 'durationchange', 'canplay', 'timeupdate'].forEach(function (ev) { audio.addEventListener(ev, refresh); });
  audio.addEventListener('play', function () { el('play').textContent = '⏸'; });
  audio.addEventListener('pause', function () { el('play').textContent = '▶'; });
  audio.addEventListener('ended', function () {
    el('play').textContent = '▶';
    refresh();
    var n = nextIndex();
    if (n >= 0) setTimeout(function () { play(n); }, 300);
  });

  function renderList() {
    var l = el('playlist'), e = el('playlist-empty');
    l.innerHTML = '';
    if (!queue.length) { e.style.display = 'block'; return; }
    e.style.display = 'none';
    queue.forEach(function (item, i) {
      var d = document.createElement('div');
      d.className = 'pl-item' + (i === index ? ' active' : '');
      var num = document.createElement('span'); num.className = 'num'; num.textContent = String(i + 1);
      var nm = document.createElement('span'); nm.className = 'name'; nm.textContent = item.name;
      var del = document.createElement('button'); del.className = 'del'; del.textContent = '✕';
      del.onclick = function (ev) { ev.stopPropagation(); removeTrack(i); };
      d.onclick = function () { play(i); };
      d.appendChild(num); d.appendChild(nm); d.appendChild(del);
      l.appendChild(d);
    });
  }
  function removeTrack(i) {
    var r = queue.splice(i, 1)[0];
    if (r && r.url) { try { URL.revokeObjectURL(r.url); } catch (e) {} }
    if (index > i) index--;
    else if (index === i) { stop(); index = -1; }
    renderList();
  }
  // 选歌走主进程的文件对话框：能拿到真实路径，重启后直接按路径恢复列表
  function saveQueue() {
    try { localStorage.setItem('pet_audio_queue', JSON.stringify(queue)); } catch (e) {}
  }
  function importAudio() {
    if (!api.pickAudio) return;
    api.pickAudio().then(function (paths) {
      if (!paths || !paths.length) return;
      paths.forEach(function (full) {
        var name = String(full).split(/[\\/]/).pop();
        queue.push({ name: name, url: 'file:///' + String(full).replace(/\\/g, '/') });
      });
      saveQueue();
      renderList();
      if (index === -1) play(0);
      var last = String(paths[paths.length - 1]).split(/[\\/]/).pop();
      if (api.musicComment) api.musicComment(last.replace(/\.(mp3|wav|flac|ogg|m4a|aac|wma)$/i, ''));
    }).catch(function () {});
  }
  // 启动时恢复上次的列表
  (function restoreQueue() {
    try {
      var raw = localStorage.getItem('pet_audio_queue');
      if (!raw) return;
      var saved = JSON.parse(raw);
      if (!Array.isArray(saved)) return;
      queue = saved.filter(function (it) { return it && it.url; });
      renderList();
    } catch (e) {}
  })();
  function play(i) {
    saveQueue();
    if (i < 0 || i >= queue.length) return;
    index = i;
    audio.src = queue[i].url;
    audio.play().catch(function () {});
    renderList();
  }
  function togglePlay() {
    if (!audio.src && queue.length) { play(0); return; }
    if (!audio.src) return;
    if (audio.paused) audio.play().catch(function () {});
    else audio.pause();
  }
  function stop() {
    audio.pause();
    audio.currentTime = 0;
    refresh();
  }
  function nextIndex() {
    var n = queue.length;
    if (!n) return -1;
    if (mode === 'single') return index;
    if (mode === 'seq') return index + 1 < n ? index + 1 : -1;
    if (mode === 'loop') return (index + 1) % n;
    if (mode === 'shuffle') { if (n === 1) return 0; var x; do { x = Math.floor(Math.random() * n); } while (x === index); return x; }
    return -1;
  }
  function prevIndex() {
    var n = queue.length;
    if (!n) return -1;
    if (mode === 'shuffle') { if (n === 1) return 0; var x; do { x = Math.floor(Math.random() * n); } while (x === index); return x; }
    var p = index - 1;
    if (p < 0) return mode === 'loop' ? n - 1 : -1;
    return p;
  }
  function setMode(m) {
    mode = m;
    document.querySelectorAll('.modes button').forEach(function (b) { b.classList.toggle('active', b.dataset.mode === m); });
  }

  var actx = null, analyser = null, freqData = null;
  var audioSrc = null;   // <audio> 的 MediaElementSource（只建一次）
  var sysAnalyser = null, sysData = null;   // 系统音频专用的分析器
  // 注意：系统音频的分析器绝对不能 connect(actx.destination)。
  // 一旦接上，系统声音会被再次播放出来、又被 loopback 录进去，形成无限回授——
  // 那声音就是用户听到的「诡异电音」，而且暂停歌也停不下来。
  function ensureAnalyser() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (!analyser) {
        analyser = actx.createAnalyser();
        analyser.fftSize = 128;
        analyser.smoothingTimeConstant = 0.6;
        freqData = new Uint8Array(analyser.frequencyBinCount);
      }
      // 关键：<audio> 必须自己也接到 analyser 上。
      // 之前 analyser 存在就直接 return，导致「先开过监听、再放本地」时
      // audio 从来没接进 analyser，于是一点数据都没有、虎鲸完全不动。
      if (!audioSrc) {
        audioSrc = actx.createMediaElementSource(audio);
        audioSrc.connect(analyser);
        analyser.connect(actx.destination);
      }
      if (actx.state === 'suspended' && !audio.paused) actx.resume().catch(function () {});
      return true;
    } catch (e) { return false; }
  }
  audio.addEventListener('play', function () { if (ensureAnalyser() && actx && actx.state === 'suspended') actx.resume().catch(function () {}); });
  // 频谱每 100ms 送一次给主窗口（算跳舞幅度）；
  // 节拍也在这里判——播放器手里有实时 analyser，判完只发一个「拍」过去，比搬整条频谱稳。
  var prevLvl = 0, lastBeatAt = 0, lastDetectAt = 0, smoothGap = 0, sysStream = null, sysSrc = null;
  var warmupUntil = 0;   // 监听刚开始的预热期，期间不采信任何间隙
  // 判定「这段声音像不像音乐」：说话、视频里的对白没有稳定节拍，低频也薄。
  // 用最近几拍的间隔离散度（cv）和低频占比两个条件一起卡。
  var beatGaps = [], lastBassRatio = 0;
  function pushBeatGap(g) {
    beatGaps.push(g);
    if (beatGaps.length > 8) beatGaps.shift();
  }
  var sysStartedAt = 0;   // 开始监听系统声音的时刻
  window.__musicGate = function () { return { gaps: beatGaps.map(function (g) { return Math.round(g); }), bass: Math.round(lastBassRatio * 100) / 100, ok: looksLikeMusic(), sys: !!sysStream }; };
  function looksLikeMusic() {
    // 本地播放器里放的就是用户自己选的歌，不用判，直接放行。
    // 只有「监听系统声音」这条路上才需要区分音乐/说话。
    if (!sysStream) return true;
    // 监听系统声音时，如果 4 秒还没攒够拍，就直接看低频够不够——
    // 有些歌鼓很闷，攒拍太慢，用户会以为「一直在监听但不跳」。
    if (sysStream && sysStartedAt && Date.now() - sysStartedAt > 2500) {
      // 系统音频这条路上，各家的音源差异很大（有的歌低频很薄），
      // 门槛压到「有点低频 或 整体够响」就认，宁可偶尔跟着视频动，也别一直干站着。
      return lastBassRatio > 0.06 || prevLvl > 0.10;
    }
    if (beatGaps.length < 2) return false;
    var n = beatGaps.length, mean = 0;
    for (var i = 0; i < n; i++) mean += beatGaps[i];
    mean /= n;
    var v = 0;
    for (var i = 0; i < n; i++) { var d = beatGaps[i] - mean; v += d * d; }
    var cv = Math.sqrt(v / n) / mean;             // 变异系数：越小越规律
    return cv < 0.42 && lastBassRatio > 0.08 && mean > 260;
  }
  setInterval(function () {
    if (audio.paused && !sysStream) return;   // 自己没放但正在监听系统声音时照样发
    var out = null;
    var curAn = sysStream ? sysAnalyser : analyser;
    var curData = sysStream ? sysData : freqData;
    if (curAn && curData) { curAn.getByteFrequencyData(curData); out = Array.from(curData); }
    else { out = Array.from({ length: 64 }, function () { return 0; }); }
    var sum = 0;
    for (var i = 0; i < out.length; i++) sum += out[i];
    var lvl = Math.min(1, (sum / out.length) / 110);
    // 低频（前 8 个 bin）占总能量的比例：鼓和贝斯厚，说话薄
    var bassE = 0;
    for (var i = 0; i < 8 && i < out.length; i++) bassE += out[i];
    lastBassRatio = sum > 0 ? bassE / sum : 0;
    var dE = lvl - prevLvl;
    prevLvl = prevLvl + (lvl - prevLvl) * 0.55;
    var now = Date.now();
    // 冷却至少 300ms（上限 3.3 拍/秒）。之前用 smoothGap*0.55，一旦估到 300ms
    // 就变成 165ms，于是每帧都判成拍，越滚越快。
    // 还没估出拍速时用 500ms 兜底，否则 smoothGap=0 会让 need 掉到 260ms，
    // 监听刚开始那一下就是靠这个一路狂点。
    var gapBase = smoothGap > 0 ? smoothGap : 500;
    var need = Math.min(1100, Math.max(300, gapBase * 0.95));
    var isBeat = 0;
    var beatAt = 0;

    // 一、能量跳变命中时，只做「校准」：把估计出来的拍间隔调准，不当成发拍依据。
    //    系统音频经过混音，跳变常常不干净，靠它直接发拍会只偶尔点一下。
    if (lvl > 0.02 && dE > 0.035 + prevLvl * 0.08) {
      var gap = lastDetectAt ? now - lastDetectAt : 0;
      lastDetectAt = now;
      if (Date.now() < warmupUntil) { /* 预热期不采信 */ }
      else if (gap > 270 && gap < 1100) {   // 55~222 BPM；下限放回 270，太快下限会把快歌整段拒掉
        pushBeatGap(gap);
        // 用中位数而不是滑动平均：偶尔被背景音带偏的一两拍会被直接忽略，
        // 歌里变速时也能较快跟上（中位数跟着样本池滚动）。
        if (beatGaps.length >= 3) {
          var sorted = beatGaps.slice().sort(function (a, b) { return a - b; });
          var mid = sorted.length >> 1;
          smoothGap = sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
        }
        // 半频校正已经去掉：它会把舒缓的歌误判成「漏了一半拍」，
        // 结果慢歌被砍成一半间隔、点头反而变快——就是你看到的那种颠倒。
        // 现在只靠中位数，宁可偶尔慢一拍，也不要整体错位。
      }
    }

    // 二、真正的发拍靠一个节拍时钟：只要在放声音，就按当前估计的拍间隔稳定地跳。
    //    这样有声音就一定有节奏，不会出现「只听得到偶尔几下」。
    if ((!audio.paused || sysStream) && prevLvl > 0.015 && now - lastBeatAt >= need) {
      lastBeatAt = now;            // 时钟无条件往前推，不然判定一失败就会卡住、然后每帧都发
      if (now < warmupUntil) { /* 预热期只测不跳 */ }
      if (looksLikeMusic()) {
        isBeat = 1;
        beatAt = now;
      }
    }
    // 第 65 位当标记：1 = 这一帧是一拍。主窗口从同一个通道里读出来，
    // 不用再开一条 IPC（新开的那条在这台机器上死活收不到）。
    out.push(isBeat);
    out.push(Math.round(smoothGap || 500));   // 拍间隔
    out.push(isBeat ? beatAt : 0);            // 重音真正发生的时刻（毫秒时间戳）
    if (api.sendAudioFreq) { try { api.sendAudioFreq(out); } catch (e) {} }
  }, 50);

  // 只读的 BPM 显示：不参与任何逻辑，纯粹用来看估计得准不准
  var bpmEl = document.getElementById('bpm-readout');
  setInterval(function () {
    if (!bpmEl) return;
    var g = smoothGap || 0;
    if (!g || (audio.paused && !sysStream)) { bpmEl.textContent = 'BPM --（没有在放）'; return; }
    var bpm = Math.round(60000 / g);
    var src = sysStream ? '系统声音' : '本地';
    bpmEl.textContent = 'BPM ' + bpm + ' · 拍间隔 ' + Math.round(g) + 'ms · ' + src;
  }, 500);

  el('import-btn').onclick = importAudio;

  // —— 监听电脑声音：抓桌面 loopback，接进同一个 analyser ——
  // 这样别的软件放歌时，虎鲸也能跟着节拍点头。
  el('sys-btn').onclick = function () {
    if (sysStream) {
      try { sysStream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
      sysStream = null;
      if (sysSrc) { try { sysSrc.disconnect(); } catch (e) {} sysSrc = null; }
      if (sysAnalyser) { try { sysAnalyser.disconnect(); } catch (e) {} }
      sysStartedAt = 0; beatGaps = [];
      el('sys-btn').classList.remove('on');
      el('sys-btn').textContent = '🎧 监听电脑声音';
      return;
    }
    if (!api.desktopAudioSource) return;
    api.desktopAudioSource().then(function (sourceId) {
      if (!sourceId) { el('sys-btn').textContent = '🎧 拿不到桌面音频源'; return; }
      var constraints = {
        audio: { mandatory: { chromeMediaSource: 'desktop', chromeMediaSourceId: sourceId } },
        video: { mandatory: { chromeMediaSource: 'desktop', chromeMediaSourceId: sourceId } },
      };
      return navigator.mediaDevices.getUserMedia(constraints).then(function (stream) {
        // 只要声音，画面丢掉
        stream.getVideoTracks().forEach(function (t) { t.stop(); stream.removeTrack(t); });
        sysStream = stream;
        if (!actx) {
          try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
        }
        if (actx.state === 'suspended') actx.resume().catch(function () {});
        if (!sysAnalyser) {
          sysAnalyser = actx.createAnalyser();
          sysAnalyser.fftSize = 128;
          sysAnalyser.smoothingTimeConstant = 0.6;
          sysData = new Uint8Array(sysAnalyser.frequencyBinCount);
        }
        sysSrc = actx.createMediaStreamSource(stream);
        sysSrc.connect(sysAnalyser);   // 只进分析器，不接扬声器
        sysStartedAt = Date.now();
        // 刚接上 loopback 的头一两秒会冒出一串假的能量跳变，如果不清理，
        // 中位数会被拉到 250ms 左右，于是开头一阵狂点。这里清空 + 预热 2.5 秒。
        beatGaps = [];
        smoothGap = 0;
        lastDetectAt = 0;
        lastBeatAt = 0;
        prevLvl = 0;
        warmupUntil = Date.now() + 2500;
        el('sys-btn').classList.add('on');
        el('sys-btn').textContent = '🎧 正在监听电脑声音（点一下停止）';
      });
    }).catch(function () {
      el('sys-btn').textContent = '🎧 系统不支持抓声音';
    });
  };
  el('play').onclick = togglePlay;
  el('stop').onclick = stop;
  el('prev').onclick = function () { var i = prevIndex(); if (i >= 0) play(i); };
  el('next').onclick = function () { var i = nextIndex(); if (i >= 0) play(i); };
  el('vol').oninput = function (e) { audio.volume = Math.max(0, Math.min(1, parseInt(e.target.value) / 100)); };
  el('seek').addEventListener('mousedown', function () { seeking = true; });
  el('seek').addEventListener('mouseup', function () { seeking = false; });
  el('seek').addEventListener('input', function (e) { var d = audio.duration; if (d && isFinite(d)) { audio.currentTime = parseInt(e.target.value) / 1000 * d; refresh(); } });
  document.querySelectorAll('.modes button').forEach(function (b) { b.onclick = function () { setMode(b.dataset.mode); }; });
  el('min-btn').onclick = function () { if (api.minimizePlayer) api.minimizePlayer(); };
  el('close-btn').onclick = function () { if (api.closePanel) api.closePanel(); };

  renderList();
})();
</script>
</body>
</html>
